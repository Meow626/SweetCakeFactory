<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Sweet Cake Factory</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40"> Sweet Cake Factory</a>
      <ul class="nav-links">
        <li><a href="index.html#menu">Menu</a></li>
        <li><a href="index.html#about">About Us</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li id="auth-nav" class="auth-slot"></li>
      </ul>
      <div class="nav-actions">
        <a class="cart-link" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM3 2a1 1 0 0 0 0 2h1.6l2.7 10.4A2 2 0 0 0 9.2 16H18a2 2 0 0 0 1.9-1.4L22 7H6.3L5.9 5.4A2 2 0 0 0 4 4H3Z"/></svg><span class="cart-badge" data-cart-count hidden>0</span></a>
        <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      </div>
    </div>
  </header>

  <div class="page-hero"><div class="wrap"><h1>Create your account</h1><p>Sign up, then log in to send cake order requests.</p></div></div>

  <main class="auth">
    <div class="wrap">
      <div class="form-card narrow">
        <div id="auth-alert" class="alert error" role="alert" hidden></div>
        <form id="auth-form" data-mode="register" novalidate>
          <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" maxlength="80" required></div>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="120" required></div>
          <div class="field"><label for="phone">Contact number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0917 123 4567" maxlength="20" required></div>
          <div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" class="pw-toggle" data-toggle-pw="password" aria-pressed="false">Show</button></div><div class="pw-meter"><span id="pw-meter"></span></div><div class="hint"><span id="pw-text"></span> At least 5 characters.</div></div>
          <div class="field"><label for="confirm">Confirm password</label><div class="pw-wrap"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><button type="button" class="pw-toggle" data-toggle-pw="confirm" aria-pressed="false">Show</button></div></div>
          <button class="btn" type="submit" style="width:100%">Create Account</button>
        </form>
        <p class="altlink">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><b>Sweet Cake Factory</b> &middot; Baked sweet. Made fresh. Shared with love.</p>
      <p>&copy; <span data-year></span> Sweet Cake Factory. All rights reserved.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="validate.js"></script>
  <script src="backend.js"></script>
  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
